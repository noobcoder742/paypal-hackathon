name: Fetch hero photo candidates (Openverse)
# Free: collects freely licensed ballroom photos for the landing page and
# commits them to the separate hero-candidates branch, with licences.
on:
  workflow_dispatch:
  push:
    branches: [updates_claude]
    paths:
      - scripts/fetch-hero-candidates.mjs
      - .github/workflows/fetch-hero-candidates.yml
permissions:
  contents: write
concurrency:
  group: fetch-hero-candidates
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch-hero-candidates.mjs /tmp/hero-candidates
      - name: Commit candidates to the hero-candidates branch
        run: |
          cd /tmp/hero-candidates
          git init -q -b hero-candidates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Hero photo candidates from Openverse"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hero-candidates
