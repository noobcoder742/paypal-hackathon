name: Keep the demo database awake

# Supabase's free tier pauses a project after a week without requests. One small read a day
# keeps the live demo working for judges.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one row through the live site
        run: curl -fsS --retry 3 --retry-delay 20 "https://wedding-studio-gray.vercel.app/api/paypal/config?ping=1"
