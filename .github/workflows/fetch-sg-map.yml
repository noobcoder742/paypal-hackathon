name: Fetch Singapore 3D map (OpenStreetMap)
# Free: GitHub's runner downloads the Geofabrik OpenStreetMap extract, cuts it
# to Singapore with osmium, tiles it and commits public/data/sg.
# Runs when the script changes, or from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [updates_claude]
    paths:
      - scripts/fetch-sg-map.mjs
      - scripts/coast-to-land.mjs
      - scripts/lib/coast-land.mjs
      - .github/workflows/fetch-sg-map.yml
permissions:
  contents: write
concurrency:
  group: fetch-sg-map
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download and cut OpenStreetMap data to Singapore
        run: |
          curl -sSfL --retry 4 -o region.osm.pbf https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf
          osmium extract -b 103.59,1.205,104.045,1.475 --strategy=smart region.osm.pbf -o sg.osm.pbf
          osmium tags-filter sg.osm.pbf nwr/building nwr/building:part w/highway nwr/leisure nwr/landuse nwr/natural nwr/water -o sg-filtered.osm.pbf
          osmium export sg-filtered.osm.pbf -f geojsonseq --geometry-types=linestring,polygon -o sg.geojsonseq
          ls -lh *.pbf sg.geojsonseq
      - name: Land polygons (sea vs land) from the coastline in the extract
        # traced from natural=coastline at 10 m, so no second download is needed
        run: node scripts/coast-to-land.mjs sg.geojsonseq land.geojson
      - run: node scripts/fetch-sg-map.mjs sg.geojsonseq land.geojson
      - name: Commit tiles if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/sg
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Singapore map tiles from OpenStreetMap"
          # retry if someone pushed to the branch while the map was building
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i*5))
          done
          exit 1
