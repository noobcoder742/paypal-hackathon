name: Fetch Singapore 3D map (OpenStreetMap)
# Free: GitHub's runner downloads OSM data for all of Singapore, tiles it and
# commits public/data/sg. Runs when the script changes, or from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [updates_claude]
    paths:
      - scripts/fetch-sg-map.mjs
      - .github/workflows/fetch-sg-map.yml
permissions:
  contents: write
concurrency:
  group: fetch-sg-map
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch-sg-map.mjs
      - name: Commit tiles if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/sg
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Singapore map tiles from OpenStreetMap"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
