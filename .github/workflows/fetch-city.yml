name: Fetch Orchard Grand surroundings (OpenStreetMap)
# Free and automatic: GitHub's runner downloads OSM buildings/roads/trees
# around the hotel and commits public/data/orchard-grand-surroundings.json.
on:
  workflow_dispatch:
  push:
    branches: [updates_claude]
    paths:
      - scripts/fetch-osm-surroundings.mjs
      - .github/workflows/fetch-city.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch-osm-surroundings.mjs
      - name: Commit data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/orchard-grand-surroundings.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Orchard Grand surroundings from OpenStreetMap"
          git push
