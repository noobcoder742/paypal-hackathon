name: Map instant picture
# Spec B2: renders the venue map's opening view to public/map-snapshot.webp
# (shown the instant the map opens cold) and commits it when it changes.
on:
  workflow_dispatch:
  push:
    branches: [updates_claude]
    paths:
      - src/explorer/**
      - public/data/sg/**
      - scripts/build-city-3d.mjs
      - scripts/render-snapshot.mjs
      - .github/workflows/map-snapshot.yml
permissions:
  contents: write
concurrency:
  group: map-snapshot
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the production build
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
      - run: node scripts/render-snapshot.mjs
        env:
          BASE_URL: http://localhost:4173
      - name: Commit the picture if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/map-snapshot.webp
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update the map's instant picture"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i*5))
          done
          exit 1
